; Copier ce fichier en config/db.ini et adapter les valeurs.
; config/db.ini est ignoré par git (voir .gitignore).

[mysql]
host = 127.0.0.1
port = 3306
user = root
password =
database = b2r_intelligence_db

; Si les notebooks sont exécutés sur Google Colab (pas d'accès au MySQL
; local), mettre use_csv_fallback = true : les modules liront alors les
; fichiers de data/exports/*.csv au lieu d'interroger la base.
[options]
use_csv_fallback = true
exports_dir = data/exports
